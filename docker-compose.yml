services:
  postgres:
    image: postgres:16-alpine
    container_name: playbooks-postgres
    environment:
      # Local development credentials only; not used outside Docker on this machine.
      POSTGRES_USER: playbooks
      POSTGRES_PASSWORD: playbooks
      POSTGRES_DB: playbooks
    ports:
      # Bound to localhost only: the API runs on the same machine; nothing else should reach the DB.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playbooks -d playbooks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
